<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riego Inteligente por Zonas</title>
<style>:root{font:16px system-ui;color:#173b31;background:#eef5ef}body{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(22px,4vw,38px)}section,.zone{background:white;padding:20px;border-radius:14px;margin:12px 0}#zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.zone{margin:0;border-left:5px solid #879c90}.active{border-color:#13834e}button{background:#176247;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;margin:4px}input,select{padding:10px;margin:5px;max-width:95%}label{display:inline-block}pre{white-space:pre-wrap}.fault{color:#b42318}#message{min-height:24px}small{color:#52665b}</style>
<header><div><small>CONTROL DE RIEGO · SIMULACIÓN</small><h1>Riego Inteligente por Zonas</h1></div><span id="connection" role="status">Conectando…</span></header>
<p><span id="schedule">Consultando horario local…</span> · Capacidad: 3 zonas · Prototipo visual pendiente de exportación Stitch</p>
<section><strong id="summary">Cargando estado</strong><p id="safety"></p><button id="rain">Activar lluvia</button><button id="stuck">Simular válvula atorada (zona elegida)</button><button id="leak">Simular fuga</button><button id="repair">Reparar válvula elegida (simulación)</button><button id="reset">Reconocer y restablecer fallo simulado</button></section>
<section><h2>Programar riego</h2><form id="program"><label>Zona <select id="zone"></select></label><label>Duración (s) <input id="duration" type="number" min="1" max="28800" value="60" required></label><label>Prioridad (0 alta) <input id="priority" type="number" min="0" max="9" value="5" required></label><button>Agregar a cola</button></form><p id="message" role="status"></p></section>
<div id="zones"></div><section><h2>Cola y detalle</h2><pre id="queue"></pre></section><section><h2>Bitácora y alertas</h2><pre id="events"></pre></section>
<script>let state={rain:false};const el=id=>document.getElementById(id);for(let i=1;i<=12;i++)el('zone').add(new Option('Zona '+i,i));
async function post(path,body){try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();el('message').textContent=r.ok?'Solicitud aceptada':JSON.stringify(j)}catch(e){el('message').textContent='Sin conexión'}}
el('program').onsubmit=e=>{e.preventDefault();post('/api/programas',{zone:+el('zone').value,duration:+el('duration').value,priority:+el('priority').value})};
el('rain').onclick=()=>post('/api/signal',{kind:'rain',value:!state.rain});el('stuck').onclick=()=>post('/api/signal',{kind:'stuck',value:+el('zone').value});el('leak').onclick=()=>post('/api/signal',{kind:'flow',value:10});el('repair').onclick=()=>post('/api/signal',{kind:'repair',value:+el('zone').value});el('reset').onclick=()=>post('/api/signal',{kind:'reset',value:true});
function render(s){state=s;el('schedule').textContent=`Inicio ${String(s.schedule.start_hour).padStart(2,'0')}:00 · ${s.schedule.duration_hours} h reales · ${s.schedule.timezone_name}`;el('summary').textContent=`${s.active.length}/3 zonas activas · Bomba ${s.pump?'encendida':'detenida'} · ${s.completed} trabajos completados · ${s.liters.toFixed(1)} litros simulados`;el('safety').textContent=s.fault?'FALLO: bomba detenida. Reparar válvulas atoradas antes de restablecer.':s.rain?'Lluvia: riego suspendido':'Control habilitado dentro de ventana';el('safety').className=s.fault?'fault':'';el('rain').textContent=s.rain?'Desactivar lluvia':'Activar lluvia';el('zones').replaceChildren(...Array.from({length:12},(_,n)=>{const j=s.active.find(j=>j.zone===n+1),v=s.valves.find(v=>v.zone===n+1),d=document.createElement('article');d.className='zone '+(v.physical==='stuck_open'?'fault':j?'active':'');d.textContent=`Zona ${n+1} · ${v.physical==='stuck_open'?'ATORADA ABIERTA · orden de cierre · bomba detenida':j?'Regando · '+j.remaining+' s restantes':'Cerrada'}`;return d}));el('queue').textContent=JSON.stringify(s.queue,null,2);el('events').textContent=s.events.map(e=>new Date(e.at*1000).toISOString()+' '+e.event).join('\n')}
function connect(){let ws=new WebSocket('ws://'+location.host+'/ws');ws.onopen=()=>el('connection').textContent='En línea';ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=()=>{el('connection').textContent='Desconectado';setTimeout(connect,2000)}}connect();</script></html>
