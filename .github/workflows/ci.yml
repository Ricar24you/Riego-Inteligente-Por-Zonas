name: Erlang validation
on: [push, pull_request]
jobs:
  otp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.24'
      - run: rebar3 compile
      - run: rebar3 eunit
      - run: python3 scripts/timezone-checks.py
      - name: HTTP and WebSocket integration
        run: TZ=America/Tijuana RIEGO_RELEASE_TEST=1 bash scripts/integration.sh
